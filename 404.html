
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | AKASH INNOVATIONS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }
    .error-code {
      font-size: clamp(80px, 20vw, 150px);
      font-weight: 900;
      color: #00d4ff;
      line-height: 1;
    }
    .error-page p {
      max-width: 480px;
      margin: 16px auto 25px;
    }
    .home-link {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 30px;
      background: #00d4ff;
      color: #06111f;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-code">404</div>
    <h1>Oops! Page Not Found</h1>
    <p>
      The page you're looking for may have been moved
      or doesn't exist. Let's get you back on track.
    </p>
    <a class="home-link" href="index.html">Back to Home</a>
    <p>AKASH INNOVATIONS · Technology for Everyone</p>
  </main>
</body>
</html>
