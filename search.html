
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Public Services | Public Service India</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#102b50;color:white;text-align:center;padding:30px 15px}
main{max-width:900px;margin:25px auto;padding:15px}
.search-box{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:14px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{padding:14px 20px;background:#0759a5;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer}
.card{background:white;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 2px 10px #0001}
.card h3{margin-top:0}
a{color:#0759a5;font-weight:bold;text-decoration:none}
.muted{color:#596579}
</style>
</head>
<body>
<header>
<h1>Search Public Service India</h1>
<p>ప్రభుత్వ సేవలు, పథకాలు మరియు స్కాలర్‌షిప్‌లను వెతకండి</p>
<p>Find information across our published pages.</p>
</header>

<main>
<div class="search-box">
<input id="query" type="search" placeholder="Try scholarship, Bapatla, schemes..." oninput="searchPages()">
<button onclick="searchPages()">Search</button>
</div>

<p id="count" class="muted" aria-live="polite">Explore all available topics below.</p>
<div id="results"></div>

<p><a href="public-service-dashboard.html">← Back to Dashboard</a></p>
</main>

<script>
const pages = [
{
title:"Student Scholarship Centre",
description:"Scholarship information, student portals and application preparation.",
url:"student-scholarship-centre.html",
keywords:"student scholarship education jnanabhumi RTF MTF విద్యార్థులు"
},
{
title:"Scholarship Document Checklist",
description:"A general checklist to help students prepare before applying.",
url:"scholarship-checklist.html",
keywords:"documents certificates marksheets income caste bank checklist"
},
{
title:"AP Post-Matric Scholarship Guide",
description:"Information about Andhra Pradesh post-matric scholarships.",
url:"ap-post-matric-scholarship.html",
keywords:"post matric fee reimbursement maintenance fee AP"
},
{
title:"Government Scheme Guide",
description:"Explore government schemes by category and find official resources.",
url:"scheme-guide.html",
keywords:"government schemes eligibility myscheme welfare"
},
{
title:"Andhra Pradesh Schemes",
description:"Government scheme categories and official information links.",
url:"ap-schemes.html",
keywords:"Andhra Pradesh AP schemes agriculture welfare ration"
},
{
title:"Andhra Pradesh Districts",
description:"Find district websites and district-wise services.",
url:"districts.html",
keywords:"district Andhra Pradesh location జిల్లాలు"
},
{
title:"Bapatla District Services",
description:"Find Bapatla district government offices and public services.",
url:"bapatla-district.html",
keywords:"Bapatla district offices collectorate బాపట్ల"
},
{
title:"Government Services Finder",
description:"Find official portals for certificates and citizen services.",
url:"services-finder.html",
keywords:"certificates documents meeseva citizen services"
},
{
title:"Public Service India",
description:"Main directory of public-service information and resources.",
url:"public-service-india.html",
keywords:"public services India government information"
},
{
title:"Feedback and Report an Issue",
description:"Report broken links or suggest corrections.",
url:"feedback.html",
keywords:"feedback issue correction broken link suggestion"
}
];

function searchPages(){
 const q=document.getElementById("query").value.trim().toLowerCase();
 const results=document.getElementById("results");

 const matches=pages.filter(page=>
  (page.title+" "+page.description+" "+page.keywords).toLowerCase().includes(q)
 );

 document.getElementById("count").textContent=
  matches.length+" result(s) found";

 if(matches.length===0){
  results.innerHTML="<div class='card'>No matching pages found. Try another search term.</div>";
  return;
 }

 results.innerHTML=matches.map(page=>
  "<article class='card'><h3>"+page.title+"</h3>"+
  "<p>"+page.description+"</p>"+
  "<a href='"+page.url+"'>Open page →</a></article>"
 ).join("");
}

searchPages();
</script>
</body>
</html>
